  #       with:
  #         record: true
  #         parallel: true
  #         group: 'Linux/Electron'
  #         browser: electron
  #         command: npx cypress run --config video=false --env version=qa
  #       env:
  #         CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  #         CYPRESS_testUsername: ${{ secrets.CYPRESS_TEST_USERNAME }}
